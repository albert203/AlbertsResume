<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Category standard sketch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap">
<style>
  * { margin:0; box-sizing:border-box; }
  body { width:1440px; height:900px; overflow:hidden; background:#fff; color:#0f172a; font-family:'Geist',sans-serif; }
  nav { display:flex; justify-content:space-between; padding:24px 120px; font-size:16px; border-bottom:1px solid #e5e7eb; }
  nav div { display:flex; gap:28px; }
  .hero { padding:110px 120px 60px; max-width:1000px; }
  h1 { font-size:72px; line-height:1.02; font-weight:700; letter-spacing:-.03em; margin-bottom:22px; }
  p { font-size:21px; line-height:1.5; color:#475569; max-width:640px; margin-bottom:32px; }
  .btn { display:inline-block; padding:14px 22px; border-radius:8px; background:#0052ff; color:#fff; font-weight:500; margin-right:10px; }
  .metrics { display:flex; gap:64px; padding:0 120px; }
  .metrics div { font-size:15px; color:#475569; } .metrics b { display:block; font-size:40px; color:#0f172a; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; padding:48px 120px; }
  .card { height:170px; border:1px solid #e5e7eb; border-radius:12px; background:#f8fafc; }
</style></head><body>
<nav><b>Albert Jordaan</b><div><span>Work</span><span>Résumé</span><span>Contact</span></div></nav>
<div class="hero"><h1>Full-stack developer who automates the slow parts.</h1><p>Payroll SaaS integrations, image pipelines and 10x faster queries, shipped to thousands of users.</p><span class="btn">Download CV</span><span class="btn" style="background:#fff;color:#0f172a;border:1px solid #cbd5e1">Get in touch</span></div>
<div class="metrics"><div><b>10x</b>faster queries</div><div><b>2</b>accounting APIs</div><div><b>1000s</b>users served</div></div>
<div class="cards"><div class="card"></div><div class="card"></div><div class="card"></div></div>
</body></html>
