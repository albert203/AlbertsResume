<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Network Diagram sketch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap">
<style>
  * { margin:0; box-sizing:border-box; }
  body { width:1440px; height:900px; overflow:hidden; background:#f7f7f5; color:#1d1d1b; font-family:'Overpass',sans-serif; }
  nav { display:flex; justify-content:space-between; padding:26px 48px; font-weight:600; font-size:16px; border-bottom:6px solid #1d1d1b; }
  nav div { display:flex; gap:32px; }
  svg { position:absolute; top:80px; left:0; }
  .panel { position:absolute; left:48px; top:130px; width:500px; background:#1d1d1b; color:#f7f7f5; padding:36px; }
  .panel h1 { font-size:64px; line-height:.95; font-weight:800; margin-bottom:18px; }
  .panel p { font-size:20px; line-height:1.45; margin-bottom:26px; }
  .panel .btns { display:flex; gap:12px; }
  .panel .btns span { padding:14px 22px; font-weight:800; background:#f2a900; color:#1d1d1b; }
  .panel .btns span + span { background:transparent; color:#f7f7f5; border:2px solid #f7f7f5; }
  .key { position:absolute; left:48px; bottom:48px; display:flex; gap:28px; font-size:15px; font-weight:600; }
  .key i { display:inline-block; width:36px; height:8px; margin-right:8px; vertical-align:middle; }
</style></head><body>
<nav><span>Albert Jordaan · Network</span><div><span>Lines</span><span>Résumé</span><span>Contact</span></div></nav>
<svg width="1440" height="820" viewBox="0 0 1440 820" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <g stroke-width="14">
    <path d="M620 160 H900 L1040 300 H1380" stroke="#0067b1"/>
    <path d="M700 620 L900 420 V160" stroke="#f2a900"/>
    <path d="M620 460 H1040 V300 L1180 160 H1380" stroke="#d6402b"/>
    <path d="M1040 460 L1200 620 H1380" stroke="#0067b1" opacity=".5"/>
  </g>
  <g fill="#fff" stroke="#1d1d1b" stroke-width="5">
    <circle cx="900" cy="160" r="20"/><circle cx="1040" cy="300" r="20"/><circle cx="900" cy="420" r="16"/><circle cx="1040" cy="460" r="20"/><circle cx="1380" cy="160" r="14"/><circle cx="1380" cy="300" r="14"/><circle cx="1380" cy="620" r="14"/>
  </g>
  <g fill="#1d1d1b" font-family="Overpass" font-weight="800" font-size="17">
    <text x="880" y="128">Payroll core</text><text x="1060" y="290">Xero</text><text x="1060" y="490">Reckon</text><text x="920" y="430">Analytics</text><text x="1300" y="138">Cloudflare Images</text><text x="1296" y="650">Google Maps</text>
  </g>
</svg>
<div class="panel"><h1>Albert Jordaan</h1><p>Full-stack developer who connects systems and removes the manual steps between them.</p><div class="btns"><span>Download CV</span><span>Contact</span></div></div>
<div class="key"><span><i style="background:#0067b1"></i>Accounting sync</span><span><i style="background:#d6402b"></i>Data &amp; performance</span><span><i style="background:#f2a900"></i>UI/UX overhauls</span></div>
</body></html>
